name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs slalom plus its ldcov dependency (prebuilt PyPI wheels)
        pip install -e .[dev]

    - name: Lint with ruff
      run: |
        ruff check slalom tests scripts

    - name: Check formatting with black
      run: |
        black --check slalom tests

    - name: Test with pytest
      run: |
        pytest tests/ --cov=slalom --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # Single modern interpreter: recent mypy no longer targets 3.9, and the pytest
        # matrix already exercises 3.9-3.13 at runtime.
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Type-check with mypy
      run: |
        mypy

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Verify install in a clean environment
      run: |
        # Test in a temp dir so the source tree doesn't shadow the installed package
        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        python -m venv test_env
        source test_env/bin/activate
        pip install "${{ github.workspace }}"/dist/*.whl
        python -c "import slalom; print('✓ slalom', slalom.__version__)"
        slalom --help > /dev/null && echo "✓ slalom CLI entry point works"
        deactivate
